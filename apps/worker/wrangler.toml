# Production / full deploy config (static UI + API on one Worker).
# For local API-only dev + Vitest, use wrangler.test.toml (see package.json "dev" / vitest.config.ts).
"$schema" = "../../node_modules/wrangler/config-schema.json"
name = "babel-room-worker"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated origins, or empty / "*" for any origin (dev). Production: https://your-worker.workers.dev
ALLOWED_ORIGINS = "babel-room-worker.yashlunawat-tech.workers.dev"
# Leave empty on deploy so /api/.../dev/* routes stay disabled.
BABEL_DEV_TOOLS = ""

[observability]
enabled = true

# Full local stack (assets + API). Vite dev proxies to wrangler.test.toml on 8788 — see README Option B.
[dev]
port = 8787

# Workers AI hits the remote API in dev; avoids misleading "not supported" / duplicate warnings.
[ai]
binding = "AI"
remote = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Replace database_id after: npx wrangler d1 create babel-room-db
[[d1_databases]]
binding = "DB"
database_name = "babel-room-db"
database_id = "e754e56e-aff9-4516-91c8-cbde8e6e17af"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "TRANSCRIPTS"
bucket_name = "babel-room-transcripts"

[[workflows]]
name = "babel-room-post-call-summary"
binding = "SUMMARY_WORKFLOW"
class_name = "PostCallSummaryWorkflow"

# Vite build output — run `npm run build -w babel-room-web` before deploy (see root "deploy" script).
# run_worker_first: only /api/* hits the Worker; SPA routes are served from assets + not_found_handling.
# Optional later: Cloudflare Realtime / RealtimeKit (SFU) — add bindings + implement `src/realtime.ts`.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
